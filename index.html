<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>English Voice Trainer</title>
  <meta name="description" content="Tutor de inglês por voz: converse em cenários reais e corrija sua pronúncia." />
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Voice Trainer" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- TELA 1: escolha de cenário -->
  <section id="screen-home" class="screen">
    <header class="topbar">
      <div class="brand">
        <img src="/icons/icon-192.png" alt="" width="32" height="32" />
        <span>Voice Trainer</span>
      </div>
      <button id="btnHistory" class="icon-btn" aria-label="Histórico">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3a9 9 0 0 0-9 9H1l3.9 3.9L8.8 12H6a7 7 0 1 1 2.05 4.95l-1.42 1.42A9 9 0 1 0 13 3zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8H12z"/></svg>
      </button>
    </header>

    <main class="home-main">
      <h1 class="home-title">Onde você quer treinar hoje?</h1>
      <p class="home-sub">Escolha uma cena. Eu falo, você repete, e eu te ajudo a soar natural.</p>

      <div id="scenarioList" class="scenario-list"></div>

      <div id="envWarning" class="warning" hidden></div>
    </main>
  </section>

  <!-- TELA 2: conversa -->
  <section id="screen-chat" class="screen" hidden>
    <header class="topbar">
      <button id="btnBack" class="icon-btn" aria-label="Voltar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="chat-title">
        <span id="chatEmoji"></span>
        <span id="chatName"></span>
      </div>
      <div class="score" aria-label="Acertos">
        ✅ <span id="scoreOk">0</span>/<span id="scoreTotal">0</span>
      </div>
    </header>

    <main id="thread" class="thread" aria-live="polite"></main>

    <footer class="dock">
      <div class="dock-actions">
        <button id="btnListen" class="pill-btn" type="button">🔊 Ouvir</button>
        <button id="btnSlow" class="pill-btn" type="button">🐢 Devagar</button>
        <button id="btnMine" class="pill-btn" type="button" disabled>🎧 Minha voz</button>
        <button id="btnSkip" class="pill-btn" type="button">⏭ Pular</button>
      </div>
      <button id="btnMic" class="mic-btn" type="button" aria-label="Gravar">
        <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
        <svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        <span class="spinner" aria-hidden="true"></span>
      </button>
      <p id="micHint" class="mic-hint">Toque para gravar</p>
    </footer>
  </section>

  <!-- TELA 3: histórico -->
  <section id="screen-history" class="screen" hidden>
    <header class="topbar">
      <button id="btnHistoryBack" class="icon-btn" aria-label="Voltar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="chat-title">Histórico</div>
      <button id="btnClearHistory" class="text-btn" type="button">Limpar</button>
    </header>
    <main class="history-main">
      <div id="historySummary" class="history-summary"></div>
      <ul id="historyList" class="history-list"></ul>
    </main>
  </section>

  <script src="/app.js"></script>
</body>
</html>
