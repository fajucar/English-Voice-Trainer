<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Glowing Sound Waves -->
  <g filter="url(#glow)" opacity="0.8">
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-dasharray="12 16" opacity="0.4" />
    <circle cx="256" cy="256" r="120" fill="none" stroke="url(#primaryGrad)" stroke-width="6" opacity="0.6" />
  </g>

  <!-- Central Badge -->
  <circle cx="256" cy="256" r="96" fill="url(#primaryGrad)" />

  <!-- Microphone Icon -->
  <!-- Mic Capsule -->
  <rect x="236" y="196" width="40" height="74" rx="20" fill="url(#micGrad)" />
  
  <!-- Mic Arc & Stand -->
  <path d="M216 244 C216 276 296 276 296 244" fill="none" stroke="url(#micGrad)" stroke-width="12" stroke-linecap="round" />
  <line x1="256" y1="276" x2="256" y2="308" stroke="url(#micGrad)" stroke-width="12" stroke-linecap="round" />
  <line x1="228" y1="308" x2="284" y2="308" stroke="url(#micGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Speech bubble accents -->
  <circle cx="370" cy="160" r="10" fill="#38bdf8" />
  <circle cx="395" cy="135" r="6" fill="#818cf8" />
  <circle cx="140" cy="160" r="10" fill="#38bdf8" />
  <circle cx="115" cy="135" r="6" fill="#818cf8" />
</svg>
